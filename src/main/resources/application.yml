server:
  port: 8083

spring:
  application:
    name: practice-project
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/practice-project}
    username: ${SPRING_DATASOURCE_USERNAME:odegaa}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  file:
    name: logs/practice-project-logs.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level : %msg%n"
  level:
    root: info
    com.odegaa.practiceproject: debug
    org.springframework.security: info

jwt:
  secret:
    key: "KMUFsIDTnFmyG3nMiGM6H9FNFUajkllsjkfASliweflkSLKjsdfjROf3wh7SmqJp-QV30"
  expire:
